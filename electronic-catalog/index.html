function toast(msg){qs('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function cover(){return esc(book.pages[0]?.src||bundledBook.pages[0].src)}
function home(){isViewer=false;document.title='9+1=10 | 电子产品图册';root.innerHTML=`<main class="shell"><header class="site-header"><div><div class="mark">9<i>+</i>1=10</div><div class="mark-sub">PROFESSIONAL UNIFORM</div></div><div class="header-r"><span class="small-label">THE DIGITAL LOOKBOOK</span><a class="ghost-btn" href="?book=${encodeURIComponent(book.id)}&p=1">在线阅读 ${icon('next')}</a></div></header><section class="hero"><div><div class="eyebrow">9+1=10  /  DIGITAL EDITION</div><h1 class="headline">FORM.<br><strong>FUNCTION.</strong><br>IDENTITY.</h1><p class="cn-headline">专业于内　风格于外</p><div class="section-line"></div><p class="hero-desc">2026 厨师服与围裙产品图册，完整收录 40 页原版内容。手机、平板与电脑均可自由翻阅。</p><div class="editorial-meta">EDITION ${esc(book.year||'2026')} &nbsp;·&nbsp; ${String(book.pages.length).padStart(2,'0')} PAGES</div><button class="primary-btn" id="enter">开启图册 ${icon('next')}</button></div><div class="hero-art"><div class="cover"><img src="${cover()}" alt="${esc(book.title)} 封面" draggable="false"></div><div class="cover-caption">${esc(book.title)}　/　${esc(book.category)}</div></div></section><footer class="bottom-band"><span>© 9+1=10</span><span>ORIGINAL · PROFESSIONAL · STYLE</span><span>DESIGNED FOR READING</span></footer></main>`;qs('#enter').onclick=()=>openViewer(0);}
function spreadStart(p){return p}
function currentPages(){return [page]}
function openViewer(p){isViewer=true;page=Math.min(Math.max(0,p),book.pages.length-1);updateUrl();renderViewer()}
function renderViewer(){
if(!isViewer)return;
document.title=book.title+' | 9+1=10';
const shown=currentPages(),first=shown[0],last=shown[shown.length-1],count=book.pages.length;
const progr=(page/(count-1))*100;
root.innerHTML=`<main class="viewer" id="viewer">
<header class="viewer-header"><div class="viewer-left"><button class="tool" data-do="home" aria-label="返回图册首页" title="图册首页">${icon('home')}</button><div class="viewer-title-wrap"><div class="viewer-title">${esc(book.title)}</div><div class="viewer-sub">${esc(book.subtitle||'DIGITAL LOOKBOOK')}</div></div></div></header>
<section class="book-stage" id="stage" aria-label="画册阅读区"><button class="turn-arrow prev" data-do="prev" aria-label="上一页" ${first===0?'disabled':''}>${icon('back')}</button><div class="stage-frame"><div class="book-stack single" id="bookstack">${shown.map(i=>`<img class="paper enter-${lastDirection}" src="${esc(book.pages[i].src)}" alt="第${i+1}页 ${esc(book.pages[i].title||'')}" loading="eager" draggable="false" data-page="${i}">`).join('')}</div></div><button class="turn-arrow next" data-do="next" aria-label="下一页" ${last>=count-1?'disabled':''}>${icon('next')}</button></section>
<footer class="bottom-reader-toolbar" aria-label="阅读与翻页工具">
<div class="seek-area"><div class="seek-count"><strong>${String(page+1).padStart(2,'0')}</strong> / ${count}</div><input class="page-seek" id="pageSeek" type="range" min="1" max="${count}" step="1" value="${page+1}" style="--seek-progress:${progr}%" aria-label="拖动跳转页面" aria-valuetext="第 ${page+1} 页，共 ${count} 页"></div>
<nav class="bottom-reader-actions" aria-label="阅读工具"><button class="tool" data-do="thumb" aria-label="页面缩略图" title="缩略图">${icon('grid')}</button><button class="tool" data-do="zoom" aria-label="放大当前页面" title="放大">${icon('zoom')}</button><button class="tool" data-do="share" aria-label="分享本页" title="分享">${icon('share')}</button><button class="tool" data-do="more" aria-label="更多操作" aria-expanded="false" title="更多">${icon('more')}</button></nav>
</footer>
<div class="toolbar-more-menu" id="readerMoreMenu" hidden><button data-do="toc">${icon('list')} 按款式查看目录</button><button data-do="prev" ${page===0?'disabled':''}>${icon('back')} 上一页</button><button data-do="next" ${page>=count-1?'disabled':''}>${icon('next')} 下一页</button><button data-do="full">${icon('full')} 全屏阅读</button></div>
</main>`;
root.querySelectorAll('[data-do]').forEach(e=>e.addEventListener('click',()=>action(e.dataset.do)));
root.querySelectorAll('.paper').forEach(e=>e.addEventListener('click',()=>openZoom(Number(e.dataset.page))));
const seek=qs('#pageSeek');
seek.addEventListener('input',()=>{seek.style.setProperty('--seek-progress',String(((Number(seek.value)-1)/(count-1))*100)+'%');const label=qs('.seek-count strong');if(label)label.textContent=String(seek.value).padStart(2,'0');seek.setAttribute('aria-valuetext',`第 ${seek.value} 页，共 ${count} 页`)});
seek.addEventListener('change',()=>go(Number(seek.value)-1));
let startX=0,startY=0;
qs('#stage').addEventListener('touchstart',e=>{startX=e.changedTouches[0].screenX;startY=e.changedTouches[0].screenY},{passive:true});
qs('#stage').addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-startX,dy=e.changedTouches[0].screenY-startY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.2)flip(dx<0?1:-1)},{passive:true});
}

function flip(dir){const n=book.pages.length;if(dir===1){const next=page+1;if(next>=n)return;page=next;lastDirection='next';}else{const prev=page-1;if(prev<0)return;page=prev;lastDirection='prev';}updateUrl();renderViewer()}
function go(n){page=Math.max(0,Math.min(book.pages.length-1,n));lastDirection='next';closeDrawer();updateUrl();renderViewer()}
function action(a){
if(a!=='more'){const menu=qs('#readerMoreMenu');if(menu)menu.hidden=true;qs('[data-do="more"]')?.setAttribute('aria-expanded','false')}
if(a==='more'){const m=qs('#readerMoreMenu'),b=qs('[data-do="more"]');if(!m)return;m.hidden=!m.hidden;b?.setAttribute('aria-expanded',String(!m.hidden));return}
if(a==='home'){isViewer=false;const u=new URL(location.href);u.search='';history.pushState(null,'',u);home()}
if(a==='next')flip(1);
if(a==='prev')flip(-1);
if(a==='thumb'||a==='toc')openDrawer(a);
if(a==='zoom')openZoom(currentPages()[0]);
if(a==='share')share();
if(a==='full'){if(document.fullscreenElement)document.exitFullscreen?.();else qs('#viewer')?.requestFullscreen?.().catch(()=>toast('当前浏览器不支持全屏'))}
}
function openDrawer(which){drawer=which;const scr=document.createElement('div');scr.className='scrim';scr.id='scrim';const el=document.createElement('aside');el.className='drawer';el.id='drawer';el.setAttribute('aria-label',which==='toc'?'目录':'页面缩略图');let contents=which==='toc'?`<div class="chapters">${(book.chapters||[{title:'封面',page:1}]).map(c=>`<button class="chapter" data-page="${c.page-1}">${esc(c.title)}<span>PAGE ${c.page}</span></button>`).join('')}</div>`:`<div class="thumbs">${book.pages.map((p,i)=>`<button class="thumb ${i===page?'active':''}" data-page="${i}"><img src="${esc(p.src)}" alt="${esc(p.title||'')}" loading="lazy"><span>${String(i+1).padStart(2,'0')} &nbsp;${esc(p.title||'')}</span></button>`).join('')}</div>`;el.innerHTML=`<div class="drawer-head"><h2>${which==='toc'?'CONTENTS / 目录':'ALL PAGES / 页面'}</h2><button class="tool" id="closeDrawer" aria-label="关闭">${icon('close')}</button></div>${contents}`;document.body.append(scr,el);scr.onclick=closeDrawer;qs('#closeDrawer').onclick=closeDrawer;el.querySelectorAll('[data-page]').forEach(x=>x.onclick=()=>go(Number(x.dataset.page)));}
function closeDrawer(){qs('#scrim')?.remove();qs('#drawer')?.remove();drawer=''}
async function share(){updateUrl();try{if(navigator.share){await navigator.share({title:book.title,text:'9+1=10 电子产品图册',url:location.href});return}if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(location.href);toast('本页阅读链接已复制');return}const ta=document.createElement('textarea');ta.value=location.href;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();const ok=document.execCommand('copy');ta.remove();toast(ok?'链接已复制':'请复制浏览器地址分享')}catch(e){if(e.name!=='AbortError')toast('请复制浏览器地址分享')}}
function openZoom(i){zoomed=i;zoom=1;const z=document.createElement('div');z.className='zoom-panel';z.id='zoomer';z.innerHTML=`<header class="zoom-head"><span style="font-size:12px;letter-spacing:.12em">第 ${i+1} 页 · ${esc(book.pages[i].title||'')}</span><div class="zoom-tools"><button class="tool" id="zminus" aria-label="缩小">${icon('minus')}</button><span id="zpct" class="zoom-percent">100%</span><button class="tool" id="zplus" aria-label="放大">${icon('plus')}</button><button class="tool" id="zclose" aria-label="关闭">${icon('close')}</button></div></header><div class="zoom-body" id="zbody"><img id="zimg" src="${esc(book.pages[i].src)}" alt="第${i+1}页" draggable="false"></div>`;document.body.append(z);qs('#zclose').onclick=closeZoom;qs('#zminus').onclick=()=>setZoom(zoom-.25);qs('#zplus').onclick=()=>setZoom(zoom+.25);qs('#zbody').ondblclick=()=>setZoom(zoom>1?1:2);}
function setZoom(v){zoom=Math.min(3,Math.max(.5,v));qs('#zimg').style.transform=`scale(${zoom})`;qs('#zpct').textContent=Math.round(zoom*100)+'%'}function closeZoom(){zoomed=-1;qs('#zoomer')?.remove()}
document.addEventListener('click',e=>{const m=qs('#readerMoreMenu');if(m&&!m.hidden&&!e.target.closest('#readerMoreMenu')&&!e.target.closest('[data-do="more"]')){m.hidden=true;qs('[data-do="more"]')?.setAttribute('aria-expanded','false')}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&!qs('#readerMoreMenu')?.hidden){qs('#readerMoreMenu').hidden=true;qs('[data-do="more"]')?.setAttribute('aria-expanded','false');return}if(zoomed>=0){if(e.key==='Escape')closeZoom();return}if(drawer){if(e.key==='Escape')closeDrawer();return}if(!isViewer)return;if(['ArrowRight','ArrowLeft','PageDown','PageUp'].includes(e.key)){e.preventDefault();flip(e.key==='ArrowRight'||e.key==='PageDown'?1:-1)}if(e.key==='Escape'&&document.fullscreenElement)document.exitFullscreen?.()});window.addEventListener('popstate',()=>{params.delete('book');const p=new URLSearchParams(location.search);book=bookById(p.get('book'));if(p.has('book'))openViewer(Math.max(0,(Number(p.get('p'))||1)-1));else home()});let lastMobile=mobile();window.addEventListener('resize',()=>{if(mobile()!==lastMobile){lastMobile=mobile();if(isViewer)renderViewer()}});
async function boot(){try{const r=await fetch('./catalog-manifest.json',{cache:'no-store'});if(r.ok){const j=await r.json();if(Array.isArray(j.books)&&j.books.length){const valid=j.books.filter(b=>b.id&&Array.isArray(b.pages)&&b.pages.length);if(valid.length)books=valid.map(b=>({...b,pages:b.pages.map(p=>typeof p==='string'?{src:p,title:''}:p)}));}}}catch(_){}const p=new URLSearchParams(location.search);book=bookById(p.get('book'));if(p.has('book'))openViewer(Math.max(0,(Number(p.get('p'))||1)-1));else home()}
boot();
})();
</script>
</body>
</html>
