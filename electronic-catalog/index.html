function toast(msg){qs('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function cover(){return esc(book.pages[0]?.src||demo.pages[0].src)}
function home(){isViewer=false;document.title='9+1=10 | 电子产品图册';root.innerHTML=`<main class="shell"><header class="site-header"><div><div class="mark">9<i>+</i>1=10</div><div class="mark-sub">PROFESSIONAL UNIFORM</div></div><div class="header-r"><span class="small-label">THE DIGITAL LOOKBOOK</span><a class="ghost-btn" href="?book=${encodeURIComponent(book.id)}&p=1">在线阅读 ${icon('next')}</a></div></header><section class="hero"><div><div class="eyebrow">9+1=10  /  DIGITAL EDITION</div><h1 class="headline">FORM.<br><strong>FUNCTION.</strong><br>IDENTITY.</h1><p class="cn-headline">专业于内　风格于外</p><div class="section-line"></div><p class="hero-desc">专业厨师职业装电子图册。为浏览而设计，以服装与细节为主角。手机、平板与电脑均可自由翻阅。</p><div class="editorial-meta">EDITION ${esc(book.year||'2026')} &nbsp;·&nbsp; ${String(book.pages.length).padStart(2,'0')} PAGES</div><button class="primary-btn" id="enter">开启图册 ${icon('next')}</button></div><div class="hero-art"><div class="cover"><img src="${cover()}" alt="${esc(book.title)} 封面" draggable="false"></div><div class="cover-caption">${esc(book.title)}　/　${esc(book.category)}</div></div></section><footer class="bottom-band"><span>© 9+1=10</span><span>ORIGINAL · PROFESSIONAL · STYLE</span><span>DESIGNED FOR READING</span></footer></main>`;qs('#enter').onclick=()=>openViewer(0);}
function spreadStart(p){if(mobile())return p;return p===0?0:(Math.floor((p-1)/2)*2+1)}
function currentPages(){const start=spreadStart(page);return !mobile()&&start>0?[start,start+1].filter(i=>i<book.pages.length):[start]}
function openViewer(p){isViewer=true;page=Math.min(Math.max(0,p),book.pages.length-1);if(!mobile())page=spreadStart(page);updateUrl();renderViewer()}
function renderViewer(){if(!isViewer)return;document.title=book.title+' | 9+1=10';let shown=currentPages(),first=shown[0],last=shown[shown.length-1],count=book.pages.length,display=first===last?`${first+1}`:`${first+1}–${last+1}`,progr=(last+1)/count*100;root.innerHTML=`<main class="viewer" id="viewer"><header class="viewer-header"><div class="viewer-left"><button class="tool" data-do="home" aria-label="返回图册首页" title="图册首页">${icon('home')}</button><div class="viewer-title-wrap"><div class="viewer-title">${esc(book.title)}</div><div class="viewer-sub">${esc(book.subtitle||'DIGITAL LOOKBOOK')}</div></div></div><div class="viewer-actions"><button class="tool" data-do="toc" aria-label="目录" title="目录">${icon('list')}</button><button class="tool" data-do="thumb" aria-label="全部页面" title="全部页面">${icon('grid')}</button><button class="tool" data-do="zoom" aria-label="放大页面" title="放大">${icon('zoom')}</button><button class="tool desktop-only" data-do="full" aria-label="全屏" title="全屏">${icon('full')}</button><button class="tool" data-do="share" aria-label="分享" title="分享">${icon('share')}</button></div></header><section class="book-stage" id="stage" aria-label="画册阅读区"><button class="turn-arrow prev" data-do="prev" aria-label="上一页" ${first===0?'disabled':''}>${icon('back')}</button><div class="book-stack ${shown.length===1?'single':''}" id="bookstack">${shown.map((i,j)=>`<img class="paper ${shown.length===2?(j===0?'left':'right'):''} enter-${lastDirection}" src="${esc(book.pages[i].src)}" alt="第${i+1}页 ${esc(book.pages[i].title||'')}" loading="eager" draggable="false" data-page="${i}">`).join('')}</div><button class="turn-arrow next" data-do="next" aria-label="下一页" ${last>=count-1?'disabled':''}>${icon('next')}</button></section><footer class="controlbar"><div class="counter"><strong>${display}</strong> <span>/ ${count}</span></div><div class="progress"><button class="tool" data-do="prev" aria-label="上一页" ${first===0?'disabled':''}>${icon('back')}</button><div class="track"><div class="fill" style="width:${progr}%"></div></div><button class="tool" data-do="next" aria-label="下一页" ${last>=count-1?'disabled':''}>${icon('next')}</button></div><div class="hint">${mobile()?'左右滑动翻页':'← → 键盘翻页'}</div></footer></main>`;
root.querySelectorAll('[data-do]').forEach(e=>e.addEventListener('click',()=>action(e.dataset.do)));root.querySelectorAll('.paper').forEach(e=>e.addEventListener('click',()=>openZoom(Number(e.dataset.page))));let startX=0,startY=0;qs('#stage').addEventListener('touchstart',e=>{startX=e.changedTouches[0].screenX;startY=e.changedTouches[0].screenY},{passive:true});qs('#stage').addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-startX,dy=e.changedTouches[0].screenY-startY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.2)flip(dx<0?1:-1)},{passive:true});}
function flip(dir){const shown=currentPages(),n=book.pages.length;if(dir===1){const next=mobile()?page+1:(page===0?1:spreadStart(page)+2);if(next>=n)return;page=next;lastDirection='next';}else{const prev=mobile()?page-1:(spreadStart(page)<=1?0:spreadStart(page)-2);if(prev<0)return;page=prev;lastDirection='prev';}updateUrl();renderViewer()}
function go(n){page=Math.max(0,Math.min(book.pages.length-1,n));page=spreadStart(page);lastDirection='next';closeDrawer();updateUrl();renderViewer()}
function action(a){if(a==='home'){isViewer=false;const u=new URL(location.href);u.search='';history.pushState(null,'',u);home()}if(a==='next')flip(1);if(a==='prev')flip(-1);if(a==='thumb'||a==='toc')openDrawer(a);if(a==='zoom')openZoom(currentPages()[0]);if(a==='share')share();if(a==='full'){if(document.fullscreenElement)document.exitFullscreen?.();else qs('#viewer')?.requestFullscreen?.().catch(()=>toast('当前浏览器不支持全屏'));}}
function openDrawer(which){drawer=which;const scr=document.createElement('div');scr.className='scrim';scr.id='scrim';const el=document.createElement('aside');el.className='drawer';el.id='drawer';el.setAttribute('aria-label',which==='toc'?'目录':'页面缩略图');let contents=which==='toc'?`<div class="chapters">${(book.chapters||[{title:'封面',page:1}]).map(c=>`<button class="chapter" data-page="${c.page-1}">${esc(c.title)}<span>PAGE ${c.page}</span></button>`).join('')}</div>`:`<div class="thumbs">${book.pages.map((p,i)=>`<button class="thumb ${i===page?'active':''}" data-page="${i}"><img src="${esc(p.src)}" alt="${esc(p.title||'')}" loading="lazy"><span>${String(i+1).padStart(2,'0')} &nbsp;${esc(p.title||'')}</span></button>`).join('')}</div>`;el.innerHTML=`<div class="drawer-head"><h2>${which==='toc'?'CONTENTS / 目录':'ALL PAGES / 页面'}</h2><button class="tool" id="closeDrawer" aria-label="关闭">${icon('close')}</button></div>${contents}`;document.body.append(scr,el);scr.onclick=closeDrawer;qs('#closeDrawer').onclick=closeDrawer;el.querySelectorAll('[data-page]').forEach(x=>x.onclick=()=>go(Number(x.dataset.page)));}
function closeDrawer(){qs('#scrim')?.remove();qs('#drawer')?.remove();drawer=''}
async function share(){updateUrl();try{if(navigator.share){await navigator.share({title:book.title,text:'9+1=10 电子产品图册',url:location.href});return}if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(location.href);toast('本页阅读链接已复制');return}const ta=document.createElement('textarea');ta.value=location.href;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();const ok=document.execCommand('copy');ta.remove();toast(ok?'链接已复制':'请复制浏览器地址分享')}catch(e){if(e.name!=='AbortError')toast('请复制浏览器地址分享')}}
function openZoom(i){zoomed=i;zoom=1;const z=document.createElement('div');z.className='zoom-panel';z.id='zoomer';z.innerHTML=`<header class="zoom-head"><span style="font-size:12px;letter-spacing:.12em">第 ${i+1} 页 · ${esc(book.pages[i].title||'')}</span><div class="zoom-tools"><button class="tool" id="zminus" aria-label="缩小">${icon('minus')}</button><span id="zpct" class="zoom-percent">100%</span><button class="tool" id="zplus" aria-label="放大">${icon('plus')}</button><button class="tool" id="zclose" aria-label="关闭">${icon('close')}</button></div></header><div class="zoom-body" id="zbody"><img id="zimg" src="${esc(book.pages[i].src)}" alt="第${i+1}页" draggable="false"></div>`;document.body.append(z);qs('#zclose').onclick=closeZoom;qs('#zminus').onclick=()=>setZoom(zoom-.25);qs('#zplus').onclick=()=>setZoom(zoom+.25);qs('#zbody').ondblclick=()=>setZoom(zoom>1?1:2);}
function setZoom(v){zoom=Math.min(3,Math.max(.5,v));qs('#zimg').style.transform=`scale(${zoom})`;qs('#zpct').textContent=Math.round(zoom*100)+'%'}function closeZoom(){zoomed=-1;qs('#zoomer')?.remove()}
window.addEventListener('keydown',e=>{if(zoomed>=0){if(e.key==='Escape')closeZoom();return}if(drawer){if(e.key==='Escape')closeDrawer();return}if(!isViewer)return;if(['ArrowRight','ArrowLeft','PageDown','PageUp'].includes(e.key)){e.preventDefault();flip(e.key==='ArrowRight'||e.key==='PageDown'?1:-1)}if(e.key==='Escape'&&document.fullscreenElement)document.exitFullscreen?.()});window.addEventListener('popstate',()=>{params.delete('book');const p=new URLSearchParams(location.search);book=bookById(p.get('book'));if(p.has('book'))openViewer(Math.max(0,(Number(p.get('p'))||1)-1));else home()});let lastMobile=mobile();window.addEventListener('resize',()=>{if(mobile()!==lastMobile){lastMobile=mobile();if(isViewer)renderViewer()}});
async function boot(){try{const r=await fetch('./catalog-manifest.json',{cache:'no-store'});if(r.ok){const j=await r.json();if(Array.isArray(j.books)&&j.books.length){const valid=j.books.filter(b=>b.id&&Array.isArray(b.pages)&&b.pages.length);if(valid.length)books=valid.map(b=>({...b,pages:b.pages.map(p=>typeof p==='string'?{src:p,title:''}:p)}));}}}catch(_){}const p=new URLSearchParams(location.search);book=bookById(p.get('book'));if(p.has('book'))openViewer(Math.max(0,(Number(p.get('p'))||1)-1));else home()}
boot();
})();
</script>
